<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f3ef">
  <title>人生管理 · 观测并经营自己的每一天</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        人生管理
      </div>
      <p class="nav-label">观测</p>
      <nav class="nav" aria-label="主导航">
        <button class="nav-item" data-nav="dashboard">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="6" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="11" width="8" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="15" width="8" height="6" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
          人生总览
        </button>
        <button class="nav-item" data-nav="goals">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
          目标管理
        </button>
      </nav>
      <p class="nav-label">日常</p>
      <nav class="nav" aria-label="日常导航">
        <button class="nav-item" data-nav="schedule">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 2v4M16 2v4M3 9h18" stroke="currentColor" stroke-width="1.8"/></svg>
          我的日程 <span class="nav-count" id="navCountSchedule">0</span>
        </button>
        <button class="nav-item" data-nav="training">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 7h12M4 5v4M20 5v4M8 12h8M6 10v4M18 10v4M6 17h12M4 15v4M20 15v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          训练记录
        </button>
        <button class="nav-item" data-nav="habits">
          <svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.8"/></svg>
          习惯打卡
        </button>
      </nav>
      <p class="nav-label">体验</p>
      <nav class="nav" aria-label="体验导航">
        <button class="nav-item" data-nav="reading">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 6c-2-1.6-4.5-2-8-2v14c3.5 0 6 .4 8 2 2-1.6 4.5-2 8-2V4c-3.5 0-6 .4-8 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6v14" stroke="currentColor" stroke-width="1.8"/></svg>
          阅读书单
        </button>
        <button class="nav-item" data-nav="travel">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
          人生清单
        </button>
        <button class="nav-item" data-nav="mystic">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a7.5 7.5 0 1 0 9 9 9 9 0 1 1-9-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 3l.7 1.8L19.5 5.5l-1.8.7L17 8l-.7-1.8-1.8-.7 1.8-.7L17 3Z" fill="currentColor"/></svg>
          玄学空间
        </button>
      </nav>
      <div class="mini-calendar">
        <div class="mini-head">
          <span id="miniMonth"></span>
          <div class="mini-month-actions">
            <button type="button" id="miniPrevMonth" aria-label="上一个月">‹</button>
            <button type="button" class="mini-today-btn" id="miniTodayMonth">今天</button>
            <button type="button" id="miniNextMonth" aria-label="下一个月">›</button>
          </div>
        </div>
        <div class="mini-grid" id="miniGrid"></div>
        <div class="mini-flow-footer">
          <span class="mini-flow-legend"><i></i> 流月第一天</span>
          <strong id="miniFlowMonthName"></strong>
        </div>
      </div>
      <button class="sync-button" data-sync-button type="button">
        <span class="sync-dot" data-sync-dot></span>
        <span data-sync-label>登录同步</span>
        <span class="sync-arrow">›</span>
      </button>
      <p class="quote">“不必填满每一分钟，<br>要让每一分钟都有意义。”</p>
    </aside>

    <main class="main">
      <div class="mobile-head">
        <nav class="mobile-tabs" id="mobileTabs" aria-label="移动端导航"></nav>
        <button class="mobile-sync" data-sync-button type="button" aria-label="云同步">
          <span class="sync-dot" data-sync-dot></span>
          <span data-sync-label>登录同步</span>
        </button>
      </div>
      <div id="viewRoot"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" id="closeModal" aria-label="关闭">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="modalForm">
        <div class="form-grid" id="modalBody"></div>
        <div class="modal-actions">
          <button type="button" class="ghost-btn delete-btn" id="modalDelete">删除</button>
          <div class="right-actions">
            <button type="button" class="ghost-btn" id="modalCancel">取消</button>
            <button type="submit" class="primary-btn" id="modalSubmit">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="flow-month-tooltip" id="flowMonthTooltip" role="status"></div>

  <script src="assets/common.js"></script>
  <script src="assets/sync.js"></script>
  <script src="assets/schedule.js"></script>
  <script src="assets/goals.js"></script>
  <script src="assets/training.js"></script>
  <script src="assets/habits.js"></script>
  <script src="assets/life.js"></script>
  <script src="assets/lunar.js"></script>
  <script src="assets/mystic.js"></script>
  <script src="assets/dashboard.js"></script>
  <script>App.init();</script>
</body>
</html>
