<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf6ef">
  <title>愿望清单 · 把想做的事都点亮</title>
  <style>
    :root {
      --canvas: #faf6ef;
      --paper: #fffdf8;
      --ink: #3d3428;
      --muted: #9a8f7d;
      --line: #e6ddcc;
      --gold: #c9a25e;
      --gold-deep: #a97f35;
      --green: #2f9e6e;
      --green-deep: #1f7a52;
      --green-soft: #e5f5ec;
      --rose: #d96c5f;
      --shadow: 0 14px 36px rgba(87, 70, 43, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 85% -10%, rgba(201, 162, 94, .14), transparent 60%),
        radial-gradient(900px 420px at -10% 20%, rgba(47, 158, 110, .10), transparent 55%),
        var(--canvas);
      font-family: "Noto Serif SC", Georgia, "PingFang SC", "Microsoft YaHei", system-ui, serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { color: inherit; font: inherit; }
    button { cursor: pointer; }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 22px 90px;
    }

    /* ---------- Header ---------- */
    .hero { text-align: center; }
    .hero .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      letter-spacing: .35em;
      text-indent: .35em;
      color: var(--gold-deep);
      text-transform: uppercase;
    }
    .hero .kicker::before, .hero .kicker::after {
      content: "";
      width: 34px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .hero .kicker::after { transform: scaleX(-1); }
    .hero h1 {
      margin: 14px 0 8px;
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 700;
      letter-spacing: .12em;
    }
    .hero p.sub {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: .08em;
    }

    /* ---------- Stats ---------- */
    .stats {
      margin: 30px auto 0;
      max-width: 640px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 24px 20px;
      box-shadow: var(--shadow);
    }
    .stats-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stats-row .count {
      font-size: 15px;
      color: var(--muted);
      letter-spacing: .04em;
    }
    .stats-row .count b {
      font-size: 26px;
      color: var(--green-deep);
      font-variant-numeric: tabular-nums;
      margin: 0 2px;
    }
    .stats-row .count .total {
      font-size: 18px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .stats-row .pct {
      font-size: 14px;
      color: var(--gold-deep);
      letter-spacing: .06em;
      font-variant-numeric: tabular-nums;
    }
    .bar {
      margin-top: 12px;
      height: 12px;
      border-radius: 999px;
      background: #f0e9db;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7cc9a4, var(--green) 55%, #22b573);
      background-size: 200% 100%;
      transition: width .7s cubic-bezier(.22, 1, .36, 1);
      animation: shimmer 3.2s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 0% 0; }
      to { background-position: -200% 0; }
    }

    /* ---------- Add form ---------- */
    .add {
      margin: 26px auto 0;
      max-width: 640px;
      display: flex;
      gap: 10px;
    }
    .add input {
      flex: 1;
      min-width: 0;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--paper);
      outline: none;
      font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    .add input::placeholder { color: #bdb3a0; }
    .add input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 162, 94, .15);
    }
    .add button {
      flex: none;
      padding: 0 26px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #d8b271, var(--gold-deep));
      color: #fff;
      font-size: 15px;
      letter-spacing: .14em;
      text-indent: .14em;
      box-shadow: 0 8px 20px rgba(169, 127, 53, .30);
      transition: transform .15s, box-shadow .15s, filter .15s;
    }
    .add button:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .add button:active { transform: translateY(1px) scale(.98); box-shadow: 0 4px 10px rgba(169, 127, 53, .25); }

    /* ---------- Filters ---------- */
    .filters {
      margin: 26px 0 4px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filters button {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .1em;
      text-indent: .1em;
      transition: all .2s;
    }
    .filters button .n {
      font-size: 12px;
      opacity: .75;
      font-variant-numeric: tabular-nums;
    }
    .filters button:hover { border-color: var(--gold); color: var(--gold-deep); }
    .filters button.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fdf9f0;
      box-shadow: 0 6px 16px rgba(61, 52, 40, .25);
    }

    /* ---------- Wish wall ---------- */
    .wall {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 10px;
      padding: 0;
      list-style: none;
    }
    .wish {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--paper);
      padding: 4px 6px 4px 4px;
      box-shadow: 0 3px 10px rgba(87, 70, 43, .07);
      animation: pop-in .35s cubic-bezier(.34, 1.56, .64, 1) both;
      transition: border-color .25s, background .25s, box-shadow .25s, transform .25s, opacity .3s;
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(.6) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .wish.leaving {
      opacity: 0;
      transform: scale(.6);
      transition: opacity .25s, transform .25s;
    }
    .wish:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(87, 70, 43, .14);
    }

    .wish .main {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: none;
      background: none;
      padding: 6px 8px 6px 6px;
      border-radius: 999px;
      max-width: 100%;
      text-align: left;
    }
    .wish .ring {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px dashed #cfc3ab;
      display: grid;
      place-items: center;
      transition: all .25s;
    }
    .wish .ring svg {
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset .3s ease .05s;
    }
    .wish .txt {
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: .02em;
      overflow-wrap: anywhere;
      transition: color .25s;
    }

    /* done state */
    .wish.done {
      background: linear-gradient(135deg, #eaf7f0, var(--green-soft));
      border-color: rgba(47, 158, 110, .45);
      border-style: solid;
    }
    .wish.done .ring {
      border: none;
      background: linear-gradient(135deg, #3cba82, var(--green-deep));
      box-shadow: 0 3px 8px rgba(47, 158, 110, .4);
    }
    .wish.done .ring svg { stroke-dashoffset: 0; }
    .wish.done .txt {
      color: var(--green-deep);
      text-decoration: line-through;
      text-decoration-color: rgba(47, 158, 110, .5);
      text-decoration-thickness: 1.5px;
    }
    .wish.just-done { animation: cheer .5s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes cheer {
      0% { transform: scale(1); }
      40% { transform: scale(1.12) rotate(-1.5deg); }
      100% { transform: scale(1); }
    }

    /* wish actions */
    .wish .ops {
      display: inline-flex;
      gap: 2px;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      /* 收起时延迟 0.3s，避免鼠标移向图标途中按钮消失 */
      transition: max-width .18s ease .3s, opacity .15s ease .3s;
    }
    .wish:hover .ops,
    .wish:focus-within .ops {
      max-width: 84px;
      opacity: 1;
      transition-delay: 0s;
    }
    .wish .ops button {
      flex: none;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: background .15s, color .15s;
    }
    .wish .ops button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wish .ops .edit:hover { background: rgba(201, 162, 94, .16); color: var(--gold-deep); }
    .wish .ops .del:hover { background: rgba(217, 108, 95, .14); color: var(--rose); }
    @media (pointer: coarse) {
      .wish .ops { max-width: 84px; opacity: 1; }
    }

    /* inline edit */
    .wish input.editor {
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px;
      padding: 6px 4px;
      min-width: 60px;
      border-bottom: 1.5px dashed var(--gold);
    }

    /* ---------- Empty state ---------- */
    .empty {
      margin: 60px auto 0;
      text-align: center;
      color: var(--muted);
      display: none;
    }
    .empty.show { display: block; animation: pop-in .4s ease both; }
    .empty .lantern {
      font-size: 44px;
      display: block;
      margin-bottom: 14px;
      animation: floaty 3s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .empty p { margin: 4px 0; font-size: 15px; letter-spacing: .06em; }

    /* ---------- Confetti ---------- */
    .confetti {
      position: fixed;
      left: 0; top: 0;
      width: 8px; height: 8px;
      pointer-events: none;
      z-index: 99;
    }

    /* ---------- Footer ---------- */
    .foot {
      margin-top: 70px;
      text-align: center;
      color: #bdb3a0;
      font-size: 13px;
      letter-spacing: .18em;
    }

    @media (max-width: 560px) {
      .wrap { padding: 34px 16px 70px; }
      .add { flex-direction: column; }
      .add button { padding: 12px 0; }
      .wish .txt { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="kicker">Wish List</span>
      <h1>愿望清单</h1>
      <p class="sub">写下想做的事，一件一件把它们点亮</p>
    </header>

    <section class="stats" aria-label="完成进度">
      <div class="stats-row">
        <span class="count">已点亮 <b id="doneCount">0</b>/ <span class="total" id="totalCount">0</span> 个愿望</span>
        <span class="pct" id="pctText">0%</span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="barFill"></i></div>
    </section>

    <form class="add" id="addForm">
      <input id="addInput" type="text" maxlength="60" placeholder="写下一个愿望，比如：亲眼看一次极光…" autocomplete="off">
      <button type="submit">许愿</button>
    </form>

    <nav class="filters" aria-label="筛选">
      <button type="button" data-filter="all" class="on">全部 <span class="n" id="nAll">0</span></button>
      <button type="button" data-filter="todo">未实现 <span class="n" id="nTodo">0</span></button>
      <button type="button" data-filter="done">已实现 <span class="n" id="nDone">0</span></button>
    </nav>

    <ul class="wall" id="wall"></ul>

    <div class="empty" id="empty">
      <span class="lantern">🏮</span>
      <p id="emptyTitle">这里还空空的</p>
      <p id="emptyHint">在上面写下第一个愿望吧</p>
    </div>

    <footer class="foot">点击气泡即可点亮 / 熄灭愿望 · 数据保存在本机浏览器</footer>
  </div>

  <script>
    (function () {
      'use strict';

      var STORAGE_KEY = 'wishlist.v1';
      var state = {
        wishes: load(),
        filter: 'all',
        editingId: null
      };

      var wall = document.getElementById('wall');
      var addForm = document.getElementById('addForm');
      var addInput = document.getElementById('addInput');
      var emptyBox = document.getElementById('empty');
      var emptyTitle = document.getElementById('emptyTitle');
      var emptyHint = document.getElementById('emptyHint');
      var filterBtns = Array.prototype.slice.call(document.querySelectorAll('.filters button'));

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          var data = raw ? JSON.parse(raw) : [];
          return Array.isArray(data) ? data.filter(function (w) {
            return w && typeof w.text === 'string';
          }) : [];
        } catch (e) {
          return [];
        }
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.wishes));
        } catch (e) { /* 存储不可用时静默降级为内存模式 */ }
      }

      function uid() {
        return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      /* ---------- Render ---------- */

      function visibleWishes() {
        return state.wishes.filter(function (w) {
          if (state.filter === 'todo') return !w.done;
          if (state.filter === 'done') return w.done;
          return true;
        });
      }

      function render() {
        var list = visibleWishes();
        wall.innerHTML = '';
        list.forEach(function (w) { wall.appendChild(buildWish(w)); });
        updateStats();
        updateEmpty(list.length);
      }

      function buildWish(w) {
        var li = document.createElement('li');
        li.className = 'wish' + (w.done ? ' done' : '');
        li.dataset.id = w.id;

        if (state.editingId === w.id) {
          var editor = document.createElement('input');
          editor.className = 'editor';
          editor.value = w.text;
          editor.maxLength = 60;
          editor.setAttribute('aria-label', '编辑愿望');
          li.appendChild(editor);
          setTimeout(function () {
            editor.focus();
            editor.setSelectionRange(editor.value.length, editor.value.length);
            editor.style.width = Math.max(60, editor.value.length * 16) + 'px';
          }, 0);
          editor.addEventListener('input', function () {
            editor.style.width = Math.max(60, editor.value.length * 16) + 'px';
          });
          editor.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') commitEdit(w.id, editor.value);
            if (ev.key === 'Escape') cancelEdit();
          });
          editor.addEventListener('blur', function () {
            commitEdit(w.id, editor.value);
          });
          return li;
        }

        var main = document.createElement('button');
        main.type = 'button';
        main.className = 'main';
        main.title = w.done ? '点击标记为未实现' : '点击标记为已实现';
        main.setAttribute('aria-pressed', w.done ? 'true' : 'false');

        var ring = document.createElement('span');
        ring.className = 'ring';
        ring.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';

        var txt = document.createElement('span');
        txt.className = 'txt';
        txt.textContent = w.text;

        main.appendChild(ring);
        main.appendChild(txt);
        main.addEventListener('click', function (ev) {
          toggle(w.id, ev);
        });

        var ops = document.createElement('span');
        ops.className = 'ops';

        var editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'edit';
        editBtn.title = '编辑';
        editBtn.setAttribute('aria-label', '编辑愿望');
        editBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
        editBtn.addEventListener('click', function () {
          state.editingId = w.id;
          render();
        });

        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'del';
        delBtn.title = '删除';
        delBtn.setAttribute('aria-label', '删除愿望');
        delBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
        delBtn.addEventListener('click', function () {
          remove(w.id, li);
        });

        ops.appendChild(editBtn);
        ops.appendChild(delBtn);
        li.appendChild(main);
        li.appendChild(ops);
        return li;
      }

      function updateStats() {
        var total = state.wishes.length;
        var done = state.wishes.filter(function (w) { return w.done; }).length;
        var pct = total ? Math.round(done / total * 100) : 0;

        document.getElementById('doneCount').textContent = done + ' ';
        document.getElementById('totalCount').textContent = total;
        document.getElementById('pctText').textContent = pct + '%';
        document.getElementById('barFill').style.width = pct + '%';
        document.getElementById('barWrap').setAttribute('aria-valuenow', pct);

        document.getElementById('nAll').textContent = total;
        document.getElementById('nTodo').textContent = total - done;
        document.getElementById('nDone').textContent = done;
      }

      function updateEmpty(visibleCount) {
        var show = visibleCount === 0;
        emptyBox.classList.toggle('show', show);
        if (!show) return;
        if (state.wishes.length === 0) {
          emptyTitle.textContent = '这里还空空的';
          emptyHint.textContent = '在上面写下第一个愿望吧';
        } else if (state.filter === 'done') {
          emptyTitle.textContent = '还没有点亮的愿望';
          emptyHint.textContent = '去实现一个，然后回来点亮它';
        } else {
          emptyTitle.textContent = '所有愿望都实现啦';
          emptyHint.textContent = '了不起！再许个新愿望吧';
        }
      }

      /* ---------- Actions ---------- */

      function addWish(text) {
        state.wishes.unshift({ id: uid(), text: text, done: false, createdAt: Date.now() });
        save();
        render();
      }

      function toggle(id, ev) {
        var w = findWish(id);
        if (!w) return;
        w.done = !w.done;
        save();
        render();
        if (w.done) {
          var li = wall.querySelector('[data-id="' + id + '"]');
          if (li) {
            li.classList.add('just-done');
            li.addEventListener('animationend', function () {
              li.classList.remove('just-done');
            }, { once: true });
            burstConfetti(li);
          } else if (ev) {
            burstConfettiAt(ev.clientX, ev.clientY);
          }
        }
      }

      function remove(id, li) {
        li.classList.add('leaving');
        setTimeout(function () {
          state.wishes = state.wishes.filter(function (w) { return w.id !== id; });
          save();
          render();
        }, 240);
      }

      function commitEdit(id, value) {
        if (state.editingId !== id) return;
        state.editingId = null;
        var text = value.trim();
        var w = findWish(id);
        if (w && text) {
          w.text = text;
          save();
        }
        render();
      }

      function cancelEdit() {
        state.editingId = null;
        render();
      }

      function findWish(id) {
        for (var i = 0; i < state.wishes.length; i++) {
          if (state.wishes[i].id === id) return state.wishes[i];
        }
        return null;
      }

      /* ---------- Confetti ---------- */

      var CONFETTI_COLORS = ['#2f9e6e', '#c9a25e', '#d96c5f', '#7c9ed9', '#e8b34b'];

      function burstConfetti(el) {
        var rect = el.getBoundingClientRect();
        burstConfettiAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      function burstConfettiAt(x, y) {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        for (var i = 0; i < 16; i++) {
          (function () {
            var p = document.createElement('span');
            p.className = 'confetti';
            var color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
            var size = 5 + Math.random() * 6;
            p.style.background = color;
            p.style.width = size + 'px';
            p.style.height = size * (Math.random() > .5 ? 1 : .45) + 'px';
            p.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
            p.style.transform = 'translate(' + x + 'px,' + y + 'px)';
            document.body.appendChild(p);

            var angle = Math.random() * Math.PI * 2;
            var dist = 50 + Math.random() * 80;
            var dx = Math.cos(angle) * dist;
            var dy = Math.sin(angle) * dist - 40;
            var rot = (Math.random() - .5) * 540;

            var anim = p.animate([
              { transform: 'translate(' + x + 'px,' + y + 'px) rotate(0deg)', opacity: 1 },
              { transform: 'translate(' + (x + dx) + 'px,' + (y + dy + 90) + 'px) rotate(' + rot + 'deg)', opacity: 0 }
            ], {
              duration: 700 + Math.random() * 500,
              easing: 'cubic-bezier(.16, .8, .4, 1)'
            });
            anim.onfinish = function () { p.remove(); };
          })();
        }
      }

      /* ---------- Events ---------- */

      addForm.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var text = addInput.value.trim();
        if (!text) return;
        addWish(text);
        addInput.value = '';
        addInput.focus();
      });

      filterBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.filter = btn.dataset.filter;
          filterBtns.forEach(function (b) { b.classList.toggle('on', b === btn); });
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
